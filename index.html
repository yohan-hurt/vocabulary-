<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 2 — People & Descriptions</title>
<style>
:root{--bg:#fbf8f3;--card:#fff;--ink:#2a2723;--muted:#76706a;--line:#ece5da;--accent:#0d9488;--shadow:0 2px 10px rgba(60,40,10,.06);
--chunk:#f97316;--verb:#3b82f6;--adjective:#a855f7;--adverb:#14b8a6;--connector:#eab308;--prep:#ec4899;--phrasal:#22c55e;--idiom:#ef4444;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#23211e;--ink:#f0ebe3;--muted:#a39c91;--line:#38342f;--shadow:none}}
:root[data-theme="dark"]{--bg:#171614;--card:#23211e;--ink:#f0ebe3;--muted:#a39c91;--line:#38342f;--shadow:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Georgia,"Times New Roman",serif}
.ui{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(135deg,#2563eb,#14b8a6 55%,#22c55e);color:#fff;padding:34px 16px 70px}
.hero>div{max-width:780px;margin:0 auto}
.hero small{display:inline-block;background:rgba(255,255,255,.22);padding:3px 12px;border-radius:999px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:2rem;line-height:1.2;margin:12px 0 6px}.hero p{margin:0;opacity:.92;font-size:1rem}
.wrap{max-width:780px;margin:-44px auto 0;padding:0 16px 60px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow);margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:999px;font-size:.95rem;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
.legend{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow)}
.legend .t{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.legend .t button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:.78rem;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);padding:5px 11px;border-radius:999px;font-size:.82rem;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip b{font-weight:600;opacity:.6;font-size:.75rem}
.chip.off{background:none;border-color:var(--line);color:var(--muted)}.chip.off i{background:var(--line)}
.rule{background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:.95rem}
.rule b{color:var(--accent)}.rule code{background:var(--card);padding:1px 6px;border-radius:6px;font-family:inherit;font-style:italic}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{display:flex;align-items:center;gap:10px;font-size:1.1rem;margin:0 0 8px}
.card h2 span{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem}
.card p{margin:0}.line{margin:5px 0!important}
mark{background:color-mix(in srgb,var(--c) 24%,transparent);border-bottom:2.5px solid var(--c);color:inherit;border-radius:4px 4px 0 0;padding:0 2px}
.m-chunk{--c:var(--chunk)}.m-verb{--c:var(--verb)}.m-adjective{--c:var(--adjective)}.m-adverb{--c:var(--adverb)}.m-connector{--c:var(--connector)}.m-prep{--c:var(--prep)}.m-phrasal{--c:var(--phrasal)}.m-idiom{--c:var(--idiom)}
.vh{display:flex;align-items:center;gap:8px;font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin:24px 0 8px;color:var(--c)}
.vh i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.vc{border-left:5px solid var(--c)}
.v{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.v:last-child{border:0}.v b{color:var(--c);font-size:1.05rem}.v small{display:block;color:var(--muted);font-size:.92rem;font-style:italic}
.es{color:var(--muted);font-size:.9rem;text-align:right}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="hero"><div class="ui">
<small>Day 2 · A1</small>
<h1 style="font-family:Georgia,serif">People & Descriptions</h1>
<p>Read the descriptions. Every color is a type of vocabulary.</p>
</div></div>
<div class="wrap ui">
<div class="tabs"><button id="t-s" class="on">Stories</button><button id="t-v">Vocabulary</button></div>
<div class="legend"><div class="t"><span>Tap a color to show / hide it</span><button id="all">Show all</button></div><div class="chips" id="chips"></div></div>
<div id="stories"></div>
<div id="vocab" hidden></div>
</div>
<script>
const CATS={chunk:"Chunks",verb:"Verbs",adjective:"Adjectives",adverb:"Adverbs",connector:"Connectors",prep:"Prepositions",phrasal:"Phrasal verbs",idiom:"Idiom"};
const pats=[
["chunk","this is my|he is very|she is really|it is a|they are so"],
["idiom","(?:a )?good-looking person"],
["phrasal","look(?:s)? like|get(?:s)? along"],
["adverb","very|really|so"],
["adjective","nice|friendly|happy|big"],
["verb","is|am|are|be|look(?:s|ing)?|like(?:s)?|know(?:s)?|live(?:s)?|living"],
["connector","and|but|because"],
["prep","with|from"]];
const re=new RegExp(pats.map(p=>"\\b("+p[1]+")\\b").join("|"),"gi");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const mark=s=>esc(s).replace(re,(...a)=>{let i=a.findIndex((x,k)=>k>0&&k<=pats.length&&x!==undefined);return `<mark class="m-${pats[i-1][0]}" title="${CATS[pats[i-1][0]]}">${a[0]}</mark>`});
const stories=[
["My Mother","This is my mother. She is really nice and very friendly. I like my mother because she is a good-looking person."],
["My Brother","My brother is from Medellín. He is very friendly with people. We get along very well."],
["My Friend Carlos","This is my friend, Carlos. He is from Bogotá. He is young but very responsible. He is very happy today."],
["A New City","They are so happy in their new city. They live in a big house. It is a beautiful home."],
["My Uncle","I know that man! He is my uncle. You look like him! He is a very nice person."],
["The Big Dog","It is a big dog. The dog is really friendly with children. I like dogs because they are fun."],
["The Shy Girl","She is really nice, but she is shy. She doesn't know many people here, because she is from a small town."],
["My Family","This is my family. We live together in a small apartment. We get along very well because we are a team."],
["A New Job","You look very happy today! Is it because you have a new job? You are a good-looking person when you smile!"],
["My Sister and I","My sister and I are very different. I am quiet, but she is really friendly. However, we get along perfectly."],
["My Father","This is my father. He is very tall and strong. People say I look like my father."],
["My Cousins","My cousins are from Cali. They are so friendly! I like visiting them because they have a big house."],
["The Small Car","It is a small car, but it is really fast. I like to drive it with my friends on weekends."],
["A Girl from Peru","I know a girl from Peru. She is really nice. She is a very good-looking person and she is always happy."],
["Grandparents","My grandparents live in the country. It is a very quiet place. They are so happy living there with their animals."],
["My English Teacher","This is my English teacher. He is very smart and nice. We get along very well in class."],
["Tired Today","You look tired today, but you still look like a good-looking person. Are you okay?"],
["My Neighbors","My neighbors are from Argentina. They are so nice. They live in the big house next to mine."],
["My Classmates","I like my classmates because they are really friendly. I know all of their names now."],
["My Cat","My cat is small, but he has a big personality. He is very funny and I like to play with him."]];
const vocab={chunk:[["This is my…","Este/a es mi…","This is my brother."],["He is very…","Él es muy…","He is very friendly."],["She is really…","Ella es realmente / muy…","She is really nice."],["It is a…","Es un/una…","It is a big house."],["They are so…","Ellos son / están tan…","They are so happy."]],
verb:[["Be","Ser / estar","My mother is kind."],["Look","Verse / parecer","You look happy."],["Like","Gustar","I like my new house."],["Know","Conocer / saber","I know that man."],["Live","Vivir","They live in a big house."]],
adjective:[["Nice","Amable / agradable","She is nice."],["Friendly","Amigable","He is friendly."],["Happy","Feliz","They are happy."],["Big","Grande","The house is big."]],
adverb:[["Very","Muy","She is very nice."],["Really","Realmente / muy","He is really friendly."],["So","Tan / muy","They are so happy."]],
connector:[["And","Y","She is nice and friendly."],["But","Pero","He is young but very responsible."],["Because","Porque","I like her because she is nice."]],
prep:[["With","Con","I am with my family."],["From","De / procedente de","She is from Colombia."]],
phrasal:[["Look like","Parecerse / tener apariencia de","You look like your father."],["Get along","Llevarse bien","We get along very well."]],
idiom:[["A good-looking person","Una persona atractiva / de buen aspecto","He is a good-looking person."]]};
const S=document.getElementById("stories"),V=document.getElementById("vocab"),C=document.getElementById("chips");
S.innerHTML=`<div class="rule"><b>Remember:</b> <code>I am</code> · <code>you are</code> · <code>he / she / it is</code> · <code>we / they are</code>. &nbsp;<code>look + adjective</code> = verse (<i>You look happy</i>) · <code>look like + person</code> = parecerse (<i>You look like your father</i>).</div>`+
stories.map((s,i)=>`<div class="card"><h2><span>${i+1}</span>${esc(s[0])}</h2><p>${mark(s[1])}</p></div>`).join("");
V.innerHTML=`<div class="rule"><b>Rutina:</b> ver y leer este vocabulario <b>dos veces</b> — 15 min al levantarse y 15 min antes de la sesión.</div>`+Object.keys(CATS).map(k=>`<div class="vh m-${k}"><i></i>${CATS[k]}</div><div class="card vc m-${k}">`+vocab[k].map(([en,es,ex])=>`<div class="v"><div><b>${esc(en)}</b><small>${mark(ex)}</small></div><div class="es">${esc(es)}</div></div>`).join("")+`</div>`).join("");
const st=document.createElement("style");st.textContent=Object.keys(CATS).map(k=>`.off-${k} mark.m-${k}{background:none;border-color:transparent}`).join("");document.head.appendChild(st);
C.innerHTML=Object.keys(CATS).map(k=>`<button class="chip m-${k}" data-k="${k}"><i></i>${CATS[k]} <b>${S.querySelectorAll("mark.m-"+k).length}</b></button>`).join("");
C.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const k=b.dataset.k;b.classList.toggle("off");document.body.classList.toggle("off-"+k)};
document.getElementById("all").onclick=()=>{C.querySelectorAll(".chip").forEach(b=>b.classList.remove("off"));Object.keys(CATS).forEach(k=>document.body.classList.remove("off-"+k))};
const ts=document.getElementById("t-s"),tv=document.getElementById("t-v");
ts.onclick=()=>{S.hidden=false;V.hidden=true;ts.classList.add("on");tv.classList.remove("on")};
tv.onclick=()=>{S.hidden=true;V.hidden=false;tv.classList.add("on");ts.classList.remove("on")};
</script>
</body>
</html>
